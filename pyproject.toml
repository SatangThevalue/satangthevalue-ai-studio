[project]
name = "satangthevalue-ai-studio"
version = "0.1.0"
description = "Enterprise-grade TTS pipeline based on F5-TTS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "gradio>=4.36.1",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.4",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "soundfile>=0.12.1",
    "librosa>=0.10.2.post1",
    "numpy>=1.26.4",
    "pedalboard>=0.9.8",
    "pyloudnorm>=0.1.1",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "f5-tts @ git+https://github.com/SWivid/F5-TTS.git",
    "whisperx @ git+https://github.com/m-bain/whisperX.git",
    "peft>=0.11.1",
    "bitsandbytes>=0.43.1",
    "accelerate>=0.30.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.2",
]
